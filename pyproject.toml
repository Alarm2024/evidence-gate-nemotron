[project]
name = "evidence-gate"
version = "0.1.0"
description = "Prove security fixes with exploit tests and Nemotron on Nebius Token Factory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not exploit'"
markers = [
    "exploit: security exploit test; fails on vulnerable demo_app (run via evidence_gate)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_gate*"]
